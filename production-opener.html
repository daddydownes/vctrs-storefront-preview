<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VCTRS opening</title>
  <!-- Opening stage extracted from the live VCTRS release; the shop owns its handoff. -->
  <style>
  :root{
    --ink:#0b0a08; --ink-2:#14120e; --bone:#efe9dc; --bone-dim:#b9b0a0;
    --gold:#d4af5f; --gold-hot:#f0d492; --line:rgba(212,175,95,.25);
  }
  body{background:var(--ink); color:var(--bone); font-family:Georgia,'Times New Roman',serif; margin:0;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent} /* kill the blue-grey flash mobile Chrome paints on every tapped control */
  .stage{position:sticky; top:0; z-index:0; height:100vh; overflow:hidden; background:var(--ink);
    width:100vw; isolation:isolate;outline:none}
  video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
  .wash{position:absolute; inset:0; pointer-events:none; background:
    linear-gradient(to bottom, rgba(11,10,8,.72), rgba(11,10,8,.12) 30%, rgba(11,10,8,.12) 65%, rgba(11,10,8,.88))}

  .hud{position:absolute; inset:0; pointer-events:none; display:flex; flex-direction:column;
    justify-content:space-between; padding:clamp(20px,4vw,48px); z-index:2}
  .hud-top{display:flex; justify-content:flex-end; align-items:flex-start; letter-spacing:.28em;
    font-size:12px; color:var(--gold); text-transform:uppercase}
  /* brand mark — the IG profile logo, avatar-style with a gold ring */
  .brand-mark{width:46px; height:46px; border-radius:50%; display:block;
    border:1px solid rgba(212,175,95,.55); box-shadow:0 0 18px rgba(0,0,0,.5)}
  /* absolutely centred — the hud's flex column lost its bottom row, so flex
     spacing alone would sink the title below the middle */
  .title-block{text-align:center; position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%); width:max-content; max-width:92vw;
    transition:opacity .8s ease}
  /* min low enough that the wordmark stays ONE line down to 320px-wide screens */
  h1{font-size:clamp(30px,11vw,128px); font-weight:400; letter-spacing:.14em; margin:0;
    text-shadow:0 2px 40px rgba(0,0,0,.6); white-space:nowrap}
  h1 .v{color:var(--gold-hot)}

  /* the 1:1 traced logo mark (V + star), set into the wordmarks in gold.
     Height: V body is 1/1.396 of the mark; 1.09em = V ~13% over cap height. */
  .vmark{height:1.09em; width:auto; display:inline-block; vertical-align:baseline;
    color:var(--gold-hot); margin-right:.1em;
    filter:drop-shadow(0 0 .18em rgba(240,212,146,.35))}
  h1 .vmark{vertical-align:-0.04em}  /* film wordmark: optical baseline match */
  .vt .vmark{vertical-align:-0.04em} /* vault title: same slight drop */

  /* film-end logo handoff: the film's last act is a black card with the white
     V+star. The site's own traced mark is laid EXACTLY over it (video px mapped
     through object-fit:cover — placeFilmLogo), then tinted white → gold: the
     film's logo becomes ours, and the rising black tide carries it into CLOSED. */
  /* once the card lands, a true-#000 cover fades over the whole video — the
     <video> element's black renders slightly LIFTED on many screens, so only a
     real #000 layer makes the card match the site's deep black exactly. The
     film's white V hands to a DOM white V (white-on-white, invisible), then gold
     POURS down the mark — that pour IS the white→gold handoff (Liquid gold descent). */
  .card-cover{position:absolute; inset:0; display:none; opacity:0;
    background:#000; pointer-events:none}
  .film-logo{position:absolute; display:none; opacity:0; pointer-events:none; z-index:10} /* above .stage-dim (z9): after the film the mark RIDES the wall out of frame at full gold — it is never dimmed */
  .film-logo .mk{position:absolute; inset:0}
  .film-logo .mk-gold{color:var(--gold-hot)}   /* the metal, uncovered by the pour */
  .film-logo .mk-white{color:#fff}              /* the film's white V, erased top→tip */
  .film-logo .vmark{height:100%; width:100%; color:inherit; margin:0}
  /* the mark's glow is driven per-tick on #filmLogo (JS) so it can be ABSENT at the
     film-V seam and rise only with the gold pour — matches the film's un-glowed white */
  /* the card IS the closing title — don't bring the wordmark back over it
     (.done.cardend: must outrank the .stage.done opacity:1 rule below) */
  .stage.done.cardend .title-block{opacity:0}

  /* post-surface "light under the door": the vault's glow seeping along the
     bottom edge + a 1px gold thread dripping from the V into it.
     LAW 2: solid hairlines + box-shadow glow only — no gradient fills. */
  /* the black tide, as a compositor-only layer. This used to be a CSS filter on
     .stage — which contains the <video>, so every scroll tick pushed the film
     frame through a filter pass and repainted a full-viewport layer, in the
     busiest frame budget on the page. z-index:9 clears every child of .stage
     (nothing in there declares above 2) so the dim covers exactly what the
     filter did, including the gold mark during the handoff. */
  .stage-dim{position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; z-index:9}


  /* letter-stagger wordmark reveal (idea 06) — spans built in JS, delays inline;
     the .vwrap span makes the traced mark ride the same reveal as a letter */
  .stagger .l{display:inline-block; opacity:0}
  .stagger.reveal .l{animation:letterUp .7s cubic-bezier(.2,.9,.3,1) forwards}
  /* V-first intro: the pour copy stacked exactly on the base mark inside .vslot.
     Sized/positioned by vMeasure() to the BASE svg's measured rect — height:100%
     of the slot span was ~16% too tall (the span's line box carries the font
     strut), which painted a second, offset V behind the mark. opacity:0 until
     JS drives it, so reduced-motion (where vRender never runs) can't show it. */
  .vslot{position:relative}
  /* Safari can expose the rectangular backing surface of a drop-shadow when a
     filtered SVG wrapper is scaled while its pour copy is being masked. Keep
     the opening mark crisp and paint its light on a separate, generously sized
     layer whose pixels are already transparent before every outer edge. */
  .vslot .vmark{filter:none; overflow:visible}
  .intro-v-halo{position:absolute; left:50%; top:50%; z-index:1; pointer-events:none;
    width:min(112vw,720px); height:min(74vh,620px); border-radius:50%; opacity:0;
    transform:translate(-50%,-50%); background:radial-gradient(ellipse at center,
      rgba(240,212,146,.52) 0%, rgba(240,212,146,.18) 24%,
      rgba(240,212,146,.045) 52%, rgba(240,212,146,0) 78%)}
  .stage.playing:not(.opening-crossfade) .intro-v-halo,.stage.done .intro-v-halo{opacity:0!important}
  .vmark.pour{position:absolute; left:0; top:0; height:100%; width:auto; margin:0; filter:none; opacity:0}
  @keyframes letterUp{from{opacity:0; transform:translateY(.35em); filter:blur(6px)}
    to{opacity:1; transform:none; filter:none}}
  .rule{width:72px; height:1px; background:var(--gold); margin:22px auto 0; opacity:.8}

  /* states */
  @keyframes pulse{50%{opacity:.35}}
  .stage.playing .title-block{opacity:0}
  .stage.playing.opening-crossfade .title-block{opacity:1}
  .stage.done .title-block{opacity:1}
  .stage{background:#000}
  .stage #film{opacity:0;transition:opacity 320ms ease}
  .stage.playing #film,.stage.done #film{opacity:1}
  .stage:not(.playing):not(.done) .wash{visibility:hidden}
  .stage .hud-top{visibility:hidden}
  /* A separate silhouette paints the light; the sharp, masked V is unfiltered. */
  .intro-v-halo{background:none;border-radius:0;transform:none;overflow:visible}
  .intro-v-halo svg{display:block;width:100%;height:100%;overflow:visible}
  @media(prefers-reduced-motion:reduce){.stage #film{transition:none}.vault{touch-action:pinch-zoom}}
  html,body{margin:0;overflow:hidden;background:#000}
  @supports(height:100dvh){.stage{height:100dvh}}
  @media(prefers-reduced-motion:reduce){.stagger .l{animation:none}}
  </style>
</head>
