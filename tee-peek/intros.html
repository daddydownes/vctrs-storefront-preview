<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#141412">
  <title>Intro studies — VCTRS</title>
  <link rel="icon" href="assets/v-star.svg" type="image/svg+xml">
  <link rel="stylesheet" href="intros.css?v=relay-mix">
  <script src="intros.js?v=2" defer></script>
</head>
<body>
  <main class="studio">
    <header class="masthead">
      <div class="identity">
        <span class="wordmark" role="img" aria-label="VCTRS"></span>
        <h1>Intro studies</h1>
      </div>
      <div class="review-tools">
        <button type="button" id="replay" hidden>Replay</button>
        <a id="full-demo" href="shop.html?intro=gold-aperture">Full demo</a>
      </div>
    </header>
    <div class="room">
      <nav class="takes" aria-label="Choose an intro">
        <a href="shop.html?intro=gold-aperture" data-intro="gold-aperture" aria-current="true">
          <strong>Gold Aperture</strong><span>The original Aperture in solid gold.</span>
        </a>
        <a href="shop.html?intro=rise" data-intro="rise">
          <strong>Soft Rise</strong><span>The whole title lifts together.</span>
        </a>
        <a href="shop.html?intro=relay" data-intro="relay">
          <strong>Word Relay</strong><span>One word follows the other.</span>
        </a>
        <a href="shop.html?intro=aperture" data-intro="aperture">
          <strong>Aperture</strong><span>The words open from the centre.</span>
        </a>
        <a href="shop.html?intro=tracking" data-intro="tracking">
          <strong>Tracking</strong><span>The letters draw together.</span>
        </a>
        <a href="shop.html?intro=gold" data-intro="gold">
          <strong>Gold Pour</strong><span>Gold rises through the type.</span>
        </a>
      </nav>
      <div id="monitor" class="monitor" aria-label="Selected demo">
        <noscript><a href="shop.html?intro=gold-aperture">Open Gold Aperture</a></noscript>
      </div>
    </div>
  </main>
</body>
</html>
